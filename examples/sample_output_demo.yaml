  - scene_id: S003
    title: 场景3：第3章 第一次改编
    source_chapters:
    - 3
    heading:
      int_ext: INT/EXT
      location: 第3章 第一次改编的核心地点
      time: 日
    synopsis: 本场根据《第3章 第一次改编》改编：林澈尝试把手稿改成短剧。他发现小说里的叙述不能直接搬上舞台，必须变成动作、对白和场景调度。经过几次失败，他终于写出了第一版剧本，也开始理解改编不是复制原文，而是重新组织故事的情绪和冲突。
    purpose: 将小说叙述转化为具有明确目标、冲突和推进作用的戏剧场景。
