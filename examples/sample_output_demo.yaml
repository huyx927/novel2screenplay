adaptation_notes:
- 演示模式采用“一章对应一场”的稳定策略，便于验证流程和展示结果。
- 正式 AI 模式可以把一个章节拆成多场，也可以把多个章节合并成一场。
- 剧本改编重点不是复述小说，而是把叙述转化为动作、对白、冲突和节拍。
