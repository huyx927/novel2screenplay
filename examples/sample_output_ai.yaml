schema_version: '1.0'
project:
  title: 手稿改编计划
  logline: 杂志社新来的实习编辑林澈在整理旧稿时发现一份被封存的无名手稿，随着他阅读并尝试将其改编成短剧，他逐渐从被动执行者变成真正理解“改编”意义的创作者。
  genre: 都市职场 / 创作成长 / 戏中戏
  target_format: web_drama
  source:
    chapter_count: 3
    chapter_titles:
    - 第1章 新编辑的第一天
    - 第2章 被遗忘的手稿
    - 第3章 第一次改编
characters:
- id: CHAR_001
  name: 林澈
  role: protagonist
  description: 杂志社新来的实习编辑，做事认真但经验不足，最初只想把分内工作完成，后来被一份手稿激发出真正的创作意识。
  arc: 从机械整理资料的新人，成长为能够判断戏剧冲突、主动重组故事的改编者。
- id: CHAR_002
  name: 周岚
  role: mentor
  description: 杂志社主编，行事干练，说话直接，表面上是给林澈布置任务的人，实际上在观察他是否具备发现故事的眼光。
  arc: 从任务分配者转变为认可林澈创作判断的引路人。
- id: CHAR_003
  name: 年轻编剧
  role: supporting
  description: 手稿故事中的人物，第一次参与剧本修改，紧张、笨拙，却最能代表“从文字走向舞台”的创作阵痛。
  arc: 从惶恐地面对修改，到开始理解戏剧需要被重新组织。
- id: CHAR_004
  name: 导演
  role: supporting
  description: 手稿故事中的剧团导演，强硬，坚持舞台效果和呈现节奏，对剧本改动要求严苛。
  arc: 作为冲突压力源，逼出年轻编剧和林澈对戏剧本质的理解。
- id: CHAR_005
  name: 演员甲
  role: supporting
  description: 手稿故事中的剧团演员，直接质疑台词和修改方向，代表“作品是否能被真正演出来”的现实声音。
  arc: 从对修改的抵触，变成推动剧本落地的真实反馈者。
locations:
- id: LOC_001
  name: 杂志社编辑部
  description: 开放式办公区，堆满待审稿件、旧杂志和打印纸，灯光明亮但节奏紧张，是林澈接受任务的工作环境。
- id: LOC_002
  name: 资料室
  description: 杂志社深处的封存空间，摆满纸箱和旧档案，灰尘厚重，藏着那份被单独封存的无名手稿。
- id: LOC_003
  name: 小镇剧团排练厅
  description: 手稿内容中的舞台空间，狭长、拥挤，布景半成品与排练道具四散，适合呈现争执和修改的戏剧冲突。
- id: LOC_004
  name: 杂志社编辑部夜班工位
  description: 深夜空下来的工作位，只剩台灯、电脑屏幕和散落的草稿，是林澈第一次把手稿改写成短剧的地方。
acts:
- act_number: 1
  title: 任务与发现
  purpose: 建立林澈的职场处境、主编的任务压力，以及封存手稿作为核心事件的引爆点。
  scenes:
  - scene_id: S001
    title: 第一天的任务
    source_chapters:
    - 1
    heading:
      int_ext: INT
      location: 杂志社编辑部
      time: DAY
    synopsis: 林澈作为新来的实习编辑报到，主编周岚直接把整理旧稿和筛选可改编故事的工作交给他。林澈本想按流程完成任务，却隐约意识到这份工作背后另有要求。
    purpose: 快速建立人物关系和改编主线，把“找故事”变成后续创作命题。
    beats:
    - 林澈第一次进入杂志社编辑部，感受忙碌而陌生的工作氛围
    - 周岚把旧稿件和整理要求交给林澈，明确强调“找出适合改编的故事”
    - 林澈表面接受任务，内心只想先把工作做好
    - 周岚有意点出“看见故事”的重要性，为后续发现手稿埋下伏笔
    action: 编辑部里电话声、打印机声和键盘声混成一片。林澈抱着笔记本站在工位旁，神情略显拘谨。周岚从一摞旧稿里抽出几份文件，连同一串资料室钥匙一起递给他，抬手指向走廊尽头。林澈接过文件，低头快速翻看封面上的年份和批注，像是在接一项普通得不能再普通的整理工作。但当周岚强调“适合改编”时，他抬头看了她一眼，第一次意识到这不是单纯归档，而是要从堆积如山的纸里找出能被重新讲述的故事。
    dialogue:
    - character: 周岚
      parenthetical: 递过文件
      line: 别只做归档。找出能被重新讲一遍的故事。
    - character: 林澈
      parenthetical: ''
      line: 我先把整理做好。
    - character: 周岚
      parenthetical: ''
      line: 先学会看见故事，再谈完成工作。
    transition: 林澈接过钥匙，转身走向走廊深处的资料室门口。
    revision_notes:
    - 可在镜头中强化编辑部的工作压力，让林澈的“新人感”更鲜明。
    - 周岚的台词要短、硬，形成对比，突出她的主编气场。
  - scene_id: S002
    title: 封存的无名手稿
    source_chapters:
    - 1
    - 2
    heading:
      int_ext: INT
      location: 资料室
      time: DAY
    synopsis: 在堆满旧纸箱的资料室里，林澈意外发现一份单独封存、没有署名的手稿。翻开后，泛黄纸页上记录着小镇剧团的公演准备和修改过程，立刻抓住了他的注意。
    purpose: 完成第一轮钩子，让手稿从“旧资料”变成“值得追读的故事核心”。
    beats:
    - 林澈打开资料室，进入封闭、安静、带有年代感的空间
    - 他在一排旧箱子中发现被单独封存的手稿，封条和泛黄纸页形成强烈视觉特征
    - 他读到手稿内容，意识到里面不是普通记录，而是一个完整的戏剧创作过程
    - 手稿像在等待某个人重新发现它，林澈被彻底吸引
    action: 资料室里光线狭窄，一束斜光落在积灰的纸箱上。林澈推开一扇吱呀作响的铁门，停在最里面的架子前。那里有一只被细绳束紧的旧文件袋，封口上贴着已经发黄的标签。林澈小心拆开，指尖蹭过纸页边缘，纸张脆得几乎要碎。他翻开第一页，眼神从疑惑变成专注。镜头切过密密麻麻的字迹、修改痕和边角折痕，仿佛纸页里正慢慢亮起一座小镇剧场的灯。
    dialogue:
    - character: 林澈
      parenthetical: 低声自语
      line: 没有署名……
    - character: 林澈
      parenthetical: ''
      line: 小镇剧团的公演过程？
    - character: 林澈
      parenthetical: ''
      line: 这不是旧稿，是一段被藏起来的排练现场。
    transition: 镜头推近手稿上的修改批注，林澈的目光停在‘第一次修改’几个字上。
    revision_notes:
    - 建议把封存状态拍成明确的“发现仪式”，让观众和林澈一起进入谜题。
    - 手稿上的批注可做特写，为后续戏中戏切换提供视觉锚点。
- act_number: 2
  title: 戏中戏与第一稿
  purpose: 把手稿内容具象化为可拍摄的戏剧冲突，并完成林澈第一次从叙述到剧本的改编尝试。
  scenes:
  - scene_id: S003
    title: 纸页里的排练厅
    source_chapters:
    - 2
    heading:
      int_ext: INT
      location: 小镇剧团排练厅
      time: DAY
    synopsis: 林澈沉浸在手稿中，眼前浮现出小镇剧团排练厅里的争执：导演坚持舞台效果，演员质疑台词不自然，年轻编剧第一次面对修改，紧张得手足无措。这个戏中戏让林澈真正理解，故事不是“写出来”就结束，而是要被重新组织。
    purpose: 把小说叙述转化为可视化冲突，让改编主题从概念落到人物动作与对白。
    beats:
    - 排练厅中道具凌乱，导演不断调整舞台构图
    - 演员甲直指台词问题，认为修改后的语言不像人说的话
    - 年轻编剧在压力下承认自己需要修改，并试图重新处理文本
    - 林澈在阅读和想象中意识到戏剧需要动作、节奏和现场冲突
    action: 排练厅里，布景只搭了一半，木梯、椅子和灯架挤在一起。导演站在台边，反复要求把最后一场做得更有冲击力。演员甲抱着剧本，直接把几句台词念得生硬又急促，明显在反抗。年轻编剧站在一旁，手里攥着被改得密密麻麻的剧本，额头冒汗，却仍努力听懂每一句意见。林澈坐在现实中的桌前翻页，画面与手稿内容交叠，导演的声音、演员的质疑和编剧的迟疑像是从纸上活了过来。他第一次清楚地看到，真正困难的不是把故事写出来，而是让它在舞台上站起来。
    dialogue:
    - character: 导演
      parenthetical: ''
      line: 最后一场必须更亮，观众要先被场面抓住。
    - character: 演员甲
      parenthetical: ''
      line: 可这些台词不像人会说的话。
    - character: 年轻编剧
      parenthetical: 握着剧本
      line: 我可以改。再给我一点时间。
    - character: 导演
      parenthetical: ''
      line: 不是给你时间，是让你想清楚自己在写什么。
    - character: 林澈
      parenthetical: 翻页停住
      line: 原来难的不是写出来，是改出来。
    transition: 林澈合上手稿，抬头看向桌上的红笔，像是被正式推上了创作战场。
    revision_notes:
    - 可采用现实阅读与手稿画面交叉剪辑，突出“戏中戏”结构。
    - 导演、演员甲、年轻编剧三人的冲突要清晰，形成改编主题的核心示范。
  - scene_id: S004
    title: 第一版短剧
    source_chapters:
    - 3
    heading:
      int_ext: INT
      location: 杂志社编辑部夜班工位
      time: NIGHT
    synopsis: 林澈开始把手稿改成短剧。起初他试图直接搬运叙述，结果文本空洞、节奏停滞；经过几轮删改后，他终于把故事重组为适合舞台呈现的动作和对白，写出了第一版剧本。
    purpose: 完成第一阶段创作成果，同时落点到“改编不是复制，而是重组情绪与冲突”。
    beats:
    - 深夜的编辑部只剩林澈一个人，他摊开手稿、便签和废稿纸
    - 他尝试把小说式叙述直接写进短剧，马上发现不适合舞台
    - 他反复删改，把心理叙述转换成可见动作和对话
    - 他敲下“短剧第一稿”标题，完成从读者到改编者的转变
    action: 夜色压住了整个编辑部，只有林澈工位上的台灯还亮着。他把手稿、笔记本和几张写废的草稿摊满桌面，电脑屏幕上是一行又一行删改过的文字。起初他试图把原文的叙述直接复制到剧本里，写完又立刻划掉，眉头越皱越紧。接着，他开始把“争执”“沉默”“犹豫”拆成具体的动作：谁先移开视线，谁把剧本摔在桌上，谁在灯下迟疑地改下一句台词。随着他不断重写，空白页终于变成了结构清晰的短剧草稿。林澈按下保存键，靠在椅背上长出一口气，屏幕上“第一稿”三个字安静地亮着。
    dialogue:
    - character: 林澈
      parenthetical: 试读台词
      line: 他心里很紧张……不行，舞台上不能这么说。
    - character: 林澈
      parenthetical: ''
      line: 要让人物自己动起来。
    - character: 林澈
      parenthetical: 敲下标题时低声说
      line: 短剧，第一稿。
    - character: 周岚
      parenthetical: 站在门口
      line: 这次像样多了。
    - character: 林澈
      parenthetical: ''
      line: 我好像明白了，改编不是照搬。
    - character: 周岚
      parenthetical: ''
      line: 是把故事重新放到灯光下。
    transition: 林澈抬头看向窗外的夜色，桌上的废稿与新稿并排放着，形成鲜明对照。
    revision_notes:
    - 若后续扩展为长篇，可补一场林澈向周岚交稿并接受反馈的戏。
    - 结尾建议保留“第一稿”的成就感，但不要完全解决全部问题，为后续打磨留空间。
adaptation_notes:
- 本改编采用“现实职场线 + 手稿戏中戏”双层结构，便于将小说中的阅读过程转化为可拍摄场面。
- 建议后续把手稿中的剧团人物进一步具名化，增强观众识别度与情感记忆点。
- 林澈与周岚的关系可继续深化为“严厉主编/潜在伯乐”，为后续修改与认可增加张力。
- 第3章的核心主题已经明确为“改编不是复制，而是重组情绪和冲突”，后续可围绕失败、修改、试演继续展开。
- 若要扩展集数，可加入一次“第一版试读”或“把短剧念给主编听”的场景，形成更完整的创作反馈链。
