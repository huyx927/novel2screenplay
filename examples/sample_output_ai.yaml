schema_version: '1.0'
project:
  title: 手稿改编计划
  logline: 杂志社实习编辑林澈在整理旧稿时意外发现一份无名手稿，并在将它改编成短剧的过程中，逐渐学会如何把被遗忘的故事重新变成可被看见的戏剧冲突。
  genre: 都市职场 / 文学改编 / 成长
  target_format: web_drama
  source:
    chapter_count: 3
    chapter_titles:
    - 第1章 新编辑的第一天
    - 第2章 被遗忘的手稿
    - 第3章 第一次改编
characters:
- id: CHAR_001
  name: 林澈
  role: protagonist
  description: 杂志社新来的实习编辑，做事谨慎，起初只想把分内工作做完；在接触无名手稿和改编练习后，开始主动追问故事为什么值得被重写。
  arc: 从只会机械整理资料的新人，成长为能主动把文字转化为戏剧场面、理解改编本质的创作者。
- id: CHAR_002
  name: 沈主编
  role: mentor
  description: 杂志社主编，语气干练，善于判断稿件价值，表面上是给任务的上级，实际上有意引导林澈学会辨别故事的戏剧核心。
  arc: 从下达任务的管理者，转变为点破改编关键、推动林澈思考的引路人。
- id: CHAR_003
  name: 年轻编剧
  role: supporting
  description: 出现在手稿闪回中的人物，首次面对剧本修改时紧张、犹豫，却又坚持让剧目成立。
  arc: 从手足无措的新人，走向敢于直面创作压力的写作者。
- id: CHAR_004
  name: 剧团导演
  role: supporting
  description: 手稿中的剧团导演，强硬执着，重视舞台效果和整体呈现，和编剧在创作理念上不断碰撞。
  arc: 从坚持自我审美的强势导演，体现出对舞台完成度的执念与专业判断。
- id: CHAR_005
  name: 资深演员
  role: supporting
  description: 手稿中的老演员，经验丰富，对不断修改的剧本既警惕又焦虑，是剧团现实压力的声音。
  arc: 从怀疑改稿会失去原味，到被迫接受舞台需要不断调整的事实。
locations:
- id: LOC_001
  name: 杂志社编辑部
  description: 开放式办公区域，堆满稿件、样刊和文件夹，体现出杂志社忙碌而现实的工作氛围。
- id: LOC_002
  name: 资料室
  description: 安静、昏暗、空气里带着纸张霉味的封存空间，旧稿件和档案整齐堆放，适合制造发现秘密的悬念感。
- id: LOC_003
  name: 编辑部工位
  description: 林澈夜晚独自改稿的桌面空间，台灯、电脑、打印纸和红笔构成创作与挫败并存的工作场景。
- id: LOC_004
  name: 小镇剧团排练厅
  description: 手稿闪回中的排练空间，简陋却真实，有舞台、灯架、折叠椅和散落的剧本，承载剧团内部的争执与创作磨合。
acts:
- act_number: 1
  title: 入职与任务
  purpose: 建立林澈的职场起点、主编的任务压力，以及旧稿整理这一看似平常却将引出核心秘密的开端。
  scenes:
  - scene_id: S001
    title: 第一天上班，第一份任务
    source_chapters:
    - 1
    heading:
      int_ext: INT
      location: 杂志社编辑部
      time: 上午
    synopsis: 林澈作为新来的实习编辑报到，沈主编直接交给他一项枯燥却关键的工作：整理一批旧稿，并筛选出适合改编的故事。
    purpose: 迅速建立人物关系与任务目标，让观众理解林澈的起点是被动接受命令，而不是主动寻找故事。
    beats:
    - 林澈走进杂志社编辑部，面对陌生而忙碌的环境。
    - 沈主编把一摞旧稿推到他面前，要求他从中找出可改编的内容。
    - 林澈表面镇定，实则把这当成一次普通的入职任务。
    - 沈主编故意强调‘别只看字面，要看故事能不能活起来’。
    action: 编辑部里电话声、键盘声和翻页声交织在一起。林澈抱着笔记本和工牌站在工位边，眼神扫过一排排堆满文件的书架。沈主编从办公室出来，把一只沉甸甸的文件盒放到他桌上，盒角贴着褪色标签。林澈打开盒子，里面是分门别类却显得陈旧的稿件、样刊和夹页批注。主编用笔敲了敲盒盖，提醒他先别急着写结论，先学会看内容背后的冲突和价值。林澈点头，把资料盒抱回怀里，朝资料室方向看了一眼。
    dialogue:
    - character: 沈主编
      parenthetical: 把资料盒推过去
      line: 先做这件事。整理旧稿，挑出能改编的故事。
    - character: 林澈
      parenthetical: 接过资料盒
      line: 明白，我会尽快整理完。
    - character: 沈主编
      parenthetical: 看着他
      line: 别只顾着完成任务，先学会看故事能不能活。
    transition: 林澈抱着资料盒走向资料室，镜头跟随他进入更安静、更封闭的空间。
    revision_notes:
    - 可补一两个同事的反应，增强职场新人的孤立感。
    - 主编的台词可在后续版本里更锋利一些，强化导师气质。
    - 资料盒的外观建议做出明显年代感，方便后续与手稿形成视觉对照。
- act_number: 2
  title: 封存手稿
  purpose: 完成核心悬念的发现，借手稿闪回呈现剧团冲突与创作压力，让林澈第一次意识到这不是普通旧稿。
  scenes:
  - scene_id: S002
    title: 被遗忘的手稿被重新翻开
    source_chapters:
    - 2
    heading:
      int_ext: INT
      location: 资料室
      time: 黄昏
    synopsis: 林澈在资料室里发现一份单独封存、没有署名的手稿，阅读时被其中关于小镇剧团排演的内容吸引，仿佛有人在等待它被重新发现。
    purpose: 通过发现无名手稿和手稿内容闪回，建立故事的神秘感、戏剧性和林澈对它的兴趣。
    beats:
    - 林澈在资料室深处翻找旧稿，注意到一份被单独封存的手稿。
    - 手稿纸页泛黄，没有署名，边缘有长久翻阅留下的折痕。
    - 他坐下阅读，画面切入手稿中的剧团排练场景。
    - 导演、演员、年轻编剧围绕剧本修改和舞台效果发生争执。
    - 林澈读到某些段落时停住，意识到这份稿子像一封没寄出的信。
    action: 资料室的灯光偏暗，尘埃在光束里缓慢飘浮。林澈拉开最下层抽屉，抽屉里只有一份用牛皮纸封住的手稿，封条已经发脆。他轻轻拆开，几页泛黄稿纸滑到桌面上。第一页没有署名，只在页脚留着细小铅笔批注。林澈翻页的动作越来越慢，手稿内容在他眼前活了起来：小镇剧团的排练厅里，导演站在舞台中央强调灯光和节奏，资深演员抱着剧本不满地质疑，年轻编剧捏着笔站在边上，手指微微发抖却不肯退让。争执声、椅子摩擦声、翻页声相互叠压，像一段被保存下来的现场录音。回到现实，林澈把手稿合上又立刻翻开，目光停在某一行批注上，像是听见了某个人隔着时间在呼吸。
    dialogue:
    - character: 剧团导演
      parenthetical: 在排练厅里
      line: 灯光再压暗一点，最后那一秒观众才会记住。
    - character: 资深演员
      parenthetical: 皱着眉，拍了拍剧本
      line: 你再这么改，角色都快不是原来的角色了。
    - character: 年轻编剧
      parenthetical: 声音发紧，却没有退让
      line: 可不改，这一场根本撑不住。
    - character: 林澈
      parenthetical: 低声自语
      line: 没有署名……为什么会单独封在这里？
    transition: 林澈把手稿贴近台灯，纸页边缘的旧痕在光下发白，切入他回到工位的夜晚准备改编。
    revision_notes:
    - 手稿闪回可使用偏暖或偏褪色的色调，与现实资料室形成视觉区分。
    - 可增加一两个更具体的舞台细节，提升剧团世界的真实感。
    - 无名手稿的来源可在后续剧集里继续扩展，但当前版本先保留神秘感。
- act_number: 3
  title: 第一次改编
  purpose: 把林澈的阅读体验转化为创作行动，展示他从理解到实践的转变，并完成对‘改编’的初步认知。
  scenes:
  - scene_id: S003
    title: 把文字变成场面
    source_chapters:
    - 3
    heading:
      int_ext: INT
      location: 编辑部工位
      time: 夜晚
    synopsis: 林澈尝试把手稿改成短剧，经历几次失败后，终于写出第一版剧本，并真正明白改编不是照抄原文，而是重新组织故事的冲突和情绪。
    purpose: 完成主人公成长的第一步，让观众看到他从‘整理资料的人’变成‘开始写作的人’。
    beats:
    - 夜深后，编辑部只剩林澈一人，他把手稿、笔记和空白剧本纸摊满桌面。
    - 他试着把原文叙述直接改成对白，却很快发现不成立。
    - 几次删改后，他开始拆解人物目标、冲突和场景动作。
    - 主编短暂回到工位边，指出他要找的是戏剧瞬间，而不是原文句子。
    - 林澈完成第一版短剧，打印出来，终于露出轻松的神情。
    action: 编辑部灯光大半熄灭，只剩林澈工位上的台灯照亮桌面。电脑屏幕里是一版又一版被划掉的文字，废纸团堆在脚边。林澈先是照着手稿照搬叙述，随即停下来，把段落拆成场景卡片，再一条条把人物冲突写成对话和动作。他站起身，在空无一人的办公区里试着念出台词，又因为不够有戏而立刻撕掉重写。桌上的红笔、便签和打印纸越来越乱，直到他找到一条新的组织方式：把剧团争执拆成可见的动作，把人物的犹疑变成当场发生的对白。打印机吐出第一版短剧稿时，他把那几页纸摊平，长长吐出一口气，像是终于把一团缠住的线理顺了。
    dialogue:
    - character: 林澈
      parenthetical: 对着稿子反复读，停下来
      line: 不对，这样还是在讲述，不是在演。
    - character: 沈主编
      parenthetical: 站在工位边，看他改稿
      line: 你要找的不是原文的句子，是冲突发生的那一秒。
    - character: 林澈
      parenthetical: 看着新打印出来的第一页
      line: 原来改编不是复制，是把情绪重新排进场面里。
    - character: 沈主编
      parenthetical: 点头
      line: 对。先把第一版写出来。后面才有得改。
    transition: 林澈把第一版剧本放在手稿旁边，镜头停在两份文本并置的桌面上。
    revision_notes:
    - 可在后续版本中加入一次简短的试读或排练，以增强‘剧本初稿’的可视化成果。
    - 主编的反馈可再更具体一点，例如指出某个场景需要动作化，帮助观众理解改编方法。
    - 结尾建议保留‘初稿完成但远未成熟’的状态，为后续打磨留出空间。
adaptation_notes:
- 本版将三章整合为三场连续的成长链条：入职任务、发现手稿、完成首版改编，结构清晰，适合继续扩写成短集或单集剧本。
- 手稿内容采用闪回方式呈现，既保留原文中的剧团争执，也让‘阅读’动作具备画面推动力。
- 目前人物命名以功能为主，若后续需要更强戏剧辨识度，可为沈主编、剧团导演等补充正式姓名。
- 建议后续版本进一步强化林澈与沈主编的师徒关系，让‘被指导’与‘自我领悟’形成更明确的双线推进。
- 适合继续打磨的重点是：将‘改编不是复制’这一主题进一步转化为具体可拍的排练、试读或删改动作。
